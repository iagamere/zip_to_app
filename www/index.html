<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<title>رافع GitHub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{--bg:#f4f5f8;--card:#fff;--tx:#12151c;--mu:#6a7282;--pr:#4f6bff;--pr2:#7c5cff;--bd:#e5e8ee;--in:#f4f5f8;--ok:#13a15a;--er:#e0364b;--sh:0 1px 2px rgba(16,24,40,.04),0 8px 24px rgba(16,24,40,.06)}
@media(prefers-color-scheme:dark){:root{--bg:#0b0d12;--card:#141821;--tx:#eceef3;--mu:#8d96a7;--bd:#232937;--in:#0f1219;--sh:0 8px 24px rgba(0,0,0,.35)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;background:radial-gradient(900px 400px at 100% -10%,rgba(79,107,255,.14),transparent 60%),radial-gradient(700px 360px at 0% 0%,rgba(124,92,255,.10),transparent 60%),var(--bg);color:var(--tx);font-family:Tajawal,system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;line-height:1.65}
main{max-width:520px;margin:0 auto;padding:max(18px,env(safe-area-inset-top)) 16px 32px}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.brand{display:flex;gap:12px;align-items:center}
.logo{width:44px;height:44px;border-radius:13px;background:linear-gradient(135deg,var(--pr),var(--pr2));color:#fff;display:grid;place-items:center;box-shadow:0 6px 16px rgba(79,107,255,.35)}
.logo .ic{width:23px;height:23px}
h1{font-size:1.15rem;font-weight:800;margin:0;line-height:1.2}
.sub{margin:2px 0 0;font-size:.8rem;color:var(--mu)}
.steps{display:flex;gap:6px;margin:0 0 16px}
.steps i{flex:1;height:4px;border-radius:4px;background:var(--bd);transition:.3s}
.steps i.on{background:linear-gradient(90deg,var(--pr),var(--pr2))}
.card{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:20px;margin-bottom:14px;box-shadow:var(--sh)}
.card h2{font-size:1.05rem;font-weight:800;margin:0 0 4px}
.mu{color:var(--mu);font-size:.88rem;margin:4px 0 14px}
input[type=text],input[type=password],input:not([type]){width:100%;padding:14px;border-radius:13px;border:1px solid var(--bd);background:var(--in);color:var(--tx);font:inherit;margin:6px 0 10px;outline:0;transition:.2s}
input:focus{border-color:var(--pr);box-shadow:0 0 0 4px rgba(79,107,255,.15)}
button{font:inherit}
.btn{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;padding:14px;border:0;border-radius:13px;background:linear-gradient(135deg,var(--pr),var(--pr2));color:#fff;font-weight:700;margin-top:8px;box-shadow:0 6px 16px rgba(79,107,255,.3);transition:.15s}
.btn:active{transform:scale(.98)}
.btn.sec{background:transparent;color:var(--tx);border:1px solid var(--bd);box-shadow:none}
.btn:disabled{opacity:.55}
.row{display:flex;gap:10px}.row .btn{flex:1}
.ib{width:38px;height:38px;border-radius:11px;border:1px solid var(--bd);background:var(--in);color:var(--tx);display:grid;place-items:center;text-decoration:none;padding:0}
.hid{display:none!important}
.modes{display:grid;gap:10px;margin-top:6px}
.mode{display:flex;gap:14px;align-items:center;text-align:right;width:100%;padding:16px;border-radius:16px;border:1px solid var(--bd);background:var(--in);color:var(--tx);transition:.15s}
.mode:active{transform:scale(.98);border-color:var(--pr)}
.tile{width:46px;height:46px;border-radius:13px;background:rgba(79,107,255,.12);color:var(--pr);display:grid;place-items:center;flex:none}
.mode b{display:block;font-size:1rem}.mode small{color:var(--mu);font-size:.82rem}
.who{display:flex;gap:12px;align-items:center}
.who img{width:46px;height:46px;border-radius:50%;border:2px solid var(--bd)}
.list{max-height:290px;overflow:auto;display:grid;gap:8px;margin:8px 0 6px}
.repo{display:flex;gap:10px;align-items:center;width:100%;padding:12px 14px;border-radius:13px;border:1px solid var(--bd);background:var(--in);color:var(--tx);text-align:right;direction:ltr;justify-content:flex-start}
.repo span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.repo.on{border-color:var(--pr);background:rgba(79,107,255,.1);color:var(--pr)}
.opt{display:flex;gap:10px;align-items:center;margin:10px 0;font-size:.92rem}
.opt input{width:18px;height:18px;margin:0;accent-color:var(--pr)}
.drop{display:flex;flex-direction:column;align-items:center;gap:8px;padding:26px 14px;border:1.5px dashed var(--bd);border-radius:16px;background:var(--in);color:var(--mu);text-align:center;margin:8px 0 12px;transition:.2s}
.drop.has{border-color:var(--pr);color:var(--tx);background:rgba(79,107,255,.07)}
.drop .tile{width:52px;height:52px}
.drop span{word-break:break-all;font-size:.92rem}
.bar{height:6px;background:var(--bd);border-radius:6px;overflow:hidden;margin:14px 0 8px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--pr),var(--pr2));transition:width .25s}
#log{font-size:.82rem;color:var(--mu);white-space:pre-wrap;max-height:130px;overflow:auto}
.err{color:var(--er);font-size:.9rem;margin:8px 0 0}
.done{display:flex;gap:12px;align-items:center;margin-bottom:8px}
.done .tile{background:rgba(19,161,90,.14);color:var(--ok)}
.lk{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid var(--bd);border-radius:15px;margin-top:10px;background:var(--in)}
.lk.main{border-color:var(--pr);background:rgba(79,107,255,.07)}
.lk .tx{flex:1;min-width:0}
.lk b{font-size:.95rem;display:block}
.lk small{display:block;color:var(--mu);font-size:.78rem}
.lk .u{display:block;direction:ltr;text-align:left;color:var(--pr);font-size:.76rem;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-decoration:none}
.lk .act{display:flex;gap:6px}
.fl{transform:scaleX(-1)}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><symbol id="i-box" viewBox="0 0 24 24"><path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/></symbol><symbol id="i-github" viewBox="0 0 24 24"><path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.4 5.4 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"/><path d="M9 18c-4.51 2-5-2-7-2"/></symbol><symbol id="i-key" viewBox="0 0 24 24"><circle cx="7.5" cy="15.5" r="4.5"/><path d="M10.7 12.3L21 2"/><path d="M17 6l3 3"/></symbol><symbol id="i-refresh" viewBox="0 0 24 24"><path d="M21 12a9 9 0 0 1-15.5 6.2L3 16"/><path d="M3 21v-5h5"/><path d="M3 12A9 9 0 0 1 18.5 5.8L21 8"/><path d="M21 3v5h-5"/></symbol><symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol><symbol id="i-lock" viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></symbol><symbol id="i-repo" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></symbol><symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 16V4"/><path d="M7 9l5-5 5 5"/><path d="M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></symbol><symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v12"/><path d="M7 11l5 5 5-5"/><path d="M4 20h16"/></symbol><symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3a14 14 0 0 1 0 18 14 14 0 0 1 0-18"/></symbol><symbol id="i-phone" viewBox="0 0 24 24"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/></symbol><symbol id="i-activity" viewBox="0 0 24 24"><path d="M3 12h4l3-8 4 16 3-8h4"/></symbol><symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></symbol><symbol id="i-ext" viewBox="0 0 24 24"><path d="M14 4h6v6"/><path d="M10 14L20 4"/><path d="M19 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h5"/></symbol><symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></symbol><symbol id="i-logout" viewBox="0 0 24 24"><path d="M9 4H5a1 1 0 0 0-1 1v14a1 1 0 0 0 1 1h4"/><path d="M16 8l4 4-4 4"/><path d="M20 12H9"/></symbol><symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></symbol><symbol id="i-zip" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M10 12h2M10 15h2M10 18h2"/></symbol></svg>
<main>
<header>
  <div class="brand"><div class="logo"><svg class="ic "><use href="#i-box"/></svg></div><div><h1>رافع GitHub</h1><p class="sub">من ملف ZIP إلى تطبيق جاهز</p></div></div>
  <button class="ib hid" id="out" onclick="logout()" aria-label="خروج"><svg class="ic "><use href="#i-logout"/></svg></button>
</header>
<div class="steps" id="steps"><i></i><i></i><i></i><i></i></div>

<section class="card" id="s1">
  <h2>تسجيل الدخول</h2>
  <p class="mu">أنشئ توكن من GitHub ← Settings ← Developer settings ← Personal access tokens (classic) وفعّل الصلاحيتين <b>repo</b> و <b>workflow</b>. يُحفظ في جهازك فقط.</p>
  <input id="tok" type="password" placeholder="ghp_xxxxxxxx" dir="ltr" autocomplete="off">
  <button class="btn" onclick="login()"><svg class="ic "><use href="#i-github"/></svg><span>دخول عبر GitHub</span></button>
  <p class="err" id="e1"></p>
</section>

<section class="card hid" id="s2">
  <div class="who"><img id="av" alt=""><div><h2 id="hello"></h2><p class="sub">ماذا تريد أن تفعل؟</p></div></div>
  <div class="modes">
    <button class="mode" onclick="pickMode('update')"><div class="tile"><svg class="ic "><use href="#i-refresh"/></svg></div><div><b>تحديث مشروع</b><small>ارفع نسخة جديدة فوق مشروع موجود</small></div></button>
    <button class="mode" onclick="pickMode('new')"><div class="tile"><svg class="ic "><use href="#i-plus"/></svg></div><div><b>مشروع جديد</b><small>أنشئ مستودعاً جديداً وابدأ منه</small></div></button>
  </div>
</section>

<section class="card hid" id="s3">
  <div id="updBox">
    <h2>اختر المشروع</h2>
    <input id="q" placeholder="بحث..." dir="ltr" oninput="fillRepos()">
    <div class="list" id="repoSel"></div>
  </div>
  <div id="newBox" class="hid">
    <h2>مشروع جديد</h2>
    <input id="newName" placeholder="project-name" dir="ltr">
    <label class="opt"><input type="checkbox" id="priv"><span>مشروع خاص (Private)</span></label>
  </div>
  <div class="row"><button class="btn sec" onclick="go(2)"><svg class="ic "><use href="#i-arrow"/></svg><span>رجوع</span></button><button class="btn" onclick="step3()"><span>التالي</span><svg class="ic fl"><use href="#i-arrow"/></svg></button></div>
  <p class="err" id="e3"></p>
</section>

<section class="card hid" id="s4">
  <h2>ملف المشروع</h2>
  <label class="drop" id="drop"><input type="file" id="zip" accept=".zip,application/zip" class="hid"><div class="tile"><svg class="ic "><use href="#i-zip"/></svg></div><span id="zname">اضغط لاختيار ملف ZIP</span></label>
  <label class="opt"><input type="checkbox" id="replace"><span>حذف الملفات القديمة واستبدالها بالكامل</span></label>
  <label class="opt"><input type="checkbox" id="pages" checked><span>تفعيل رابط التطبيق (GitHub Pages)</span></label>
  <label class="opt"><input type="checkbox" id="autoapk" checked><span>بناء APK تلقائياً حسب نوع المشروع</span></label>
  <input id="msg" placeholder="رسالة التحديث (اختياري)">
  <div class="row"><button class="btn sec" onclick="go(3)"><svg class="ic "><use href="#i-arrow"/></svg><span>رجوع</span></button><button class="btn" id="upBtn" onclick="upload()"><svg class="ic "><use href="#i-upload"/></svg><span>رفع</span></button></div>
  <div class="bar hid" id="bar"><i id="bi"></i></div>
  <div id="log"></div>
  <p class="err" id="e4"></p>
</section>

<section class="card hid" id="s5">
  <div class="done"><div class="tile"><svg class="ic "><use href="#i-check"/></svg></div><div><h2>تم الرفع بنجاح</h2><p class="sub" id="note"></p></div></div>
  <div id="links"></div>
  <button class="btn sec" onclick="go(2)"><svg class="ic "><use href="#i-upload"/></svg><span>رفع مشروع آخر</span></button>
</section>
</main>
<script>
const $=s=>document.getElementById(s);
let token='',user=null,repos=[],mode='',zipFile=null;
const ic=(n,c='')=>`<svg class="ic ${c}"><use href="#i-${n}"/></svg>`;
const store={get:k=>{try{return localStorage.getItem(k)}catch{return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch{}},del:k=>{try{localStorage.removeItem(k)}catch{}}};

function go(n){for(let i=1;i<=5;i++)$('s'+i).classList.toggle('hid',i!==n);$('out').classList.toggle('hid',!user);[...$('steps').children].forEach((e,i)=>e.classList.toggle('on',i<Math.min(n,4)||n===5))}
async function gh(path,opt={}){
  const r=await fetch('https://api.github.com'+path,{...opt,headers:{Authorization:'Bearer '+token,Accept:'application/vnd.github+json','Content-Type':'application/json'}});
  if(!r.ok){let m='';try{m=(await r.json()).message}catch{}const e=new Error(m||('HTTP '+r.status));e.status=r.status;throw e}
  return r.status===204?null:r.json();
}
async function login(t){
  token=(typeof t==='string'?t:$('tok').value).trim();$('e1').textContent='⏳ جاري التحقق...';
  if(!token){$('e1').textContent='أدخل التوكن';return}
  try{
    user=await gh('/user');$('e1').textContent='';store.set('gh_token',token);
    $('hello').textContent=user.login;$('av').src=user.avatar_url||'';go(2);
  }catch(e){user=null;token='';store.del('gh_token');go(1);$('e1').textContent='فشل الدخول: '+e.message}
}
function logout(){store.del('gh_token');user=null;token='';repos=[];$('tok').value='';go(1)}
async function loadRepos(){
  repos=[];
  for(let p=1;p<=5;p++){
    const r=await gh(`/user/repos?per_page=100&page=${p}&sort=updated&affiliation=owner`);
    repos.push(...r);if(r.length<100)break;
  }
}
let sel='';
function fillRepos(){
  const q=$('q').value.toLowerCase(),box=$('repoSel');box.innerHTML='';
  repos.filter(r=>r.name.toLowerCase().includes(q)).forEach(r=>{
    const b=document.createElement('button');b.type='button';b.className='repo'+(sel===r.full_name?' on':'');
    b.innerHTML=ic(r.private?'lock':'repo')+'<span></span>';b.lastChild.textContent=r.name;
    b.onclick=()=>{sel=r.full_name;fillRepos()};box.appendChild(b);
  });
}
async function pickMode(m){
  mode=m;$('e3').textContent='';
  $('updBox').classList.toggle('hid',m!=='update');$('newBox').classList.toggle('hid',m!=='new');
  go(3);
  if(m==='update'&&!repos.length){
    $('repoSel').innerHTML='<p class="mu">جاري التحميل...</p>';
    try{await loadRepos()}catch(e){$('e3').textContent=e.message}
    fillRepos();
  }
}
let target=null;
function step3(){
  $('e3').textContent='';
  if(mode==='update'){
    const v=sel;if(!v){$('e3').textContent='اختر مشروعاً';return}
    target=repos.find(r=>r.full_name===v);
  }else{
    const n=$('newName').value.trim();
    if(!/^[A-Za-z0-9._-]+$/.test(n)){$('e3').textContent='اسم غير صالح: أحرف إنجليزية وأرقام و - _ . فقط';return}
    target={name:n,newRepo:true};
  }
  go(4);
}
const log=t=>{$('log').textContent+=t+'\n';$('log').scrollTop=1e9};
const prog=p=>{$('bi').style.width=p+'%'};

const dirOf=p=>p.includes('/')?p.slice(0,p.lastIndexOf('/')):'.';
const shortest=a=>a.sort((x,y)=>x.split('/').length-y.split('/').length)[0];
function detect(paths){
  const f=re=>shortest(paths.filter(p=>re.test(p)));let p;
  if(p=f(/(^|\/)pubspec\.yaml$/))return{t:'flutter',dir:dirOf(p),label:'Flutter'};
  if(p=f(/(^|\/)capacitor\.config\.(json|ts|js)$/))return{t:'cap',dir:dirOf(p),label:'Capacitor'};
  if(p=f(/(^|\/)settings\.gradle(\.kts)?$/))return{t:'android',dir:dirOf(p),label:'Android (Gradle)'};
  if(p=f(/(^|\/)index\.html$/))return{t:'web',dir:dirOf(p),label:'ويب (HTML)'};
  return null;
}
function workflow(d){
  const D=d.dir;
  const J17=`      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
`;
  const NODE=`      - uses: actions/setup-node@v4
        with:
          node-version: 20
`;
  let steps='';
  if(d.t==='android')steps=J17+`      - name: Accept licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build
        run: |
          cd "${D}"
          if [ -f gradlew ]; then chmod +x gradlew; ./gradlew assembleDebug --no-daemon --stacktrace; else gradle assembleDebug --no-daemon --stacktrace; fi
`;
  else if(d.t==='flutter')steps=J17+`      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build
        run: |
          cd "${D}"
          [ -d android ] || flutter create --platforms=android .
          flutter pub get
          flutter build apk --release
`;
  else if(d.t==='cap')steps=NODE+J17+`      - name: Build
        run: |
          cd "${D}"
          npm install
          npm run build --if-present
          [ -d android ] || npx cap add android
          npx cap sync android
          cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
`;
  else steps=NODE+J17+`      - name: Wrap web app
        run: |
          mkdir -p /tmp/cap/www
          cp -r "${D}"/. /tmp/cap/www/
          cd /tmp/cap
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "Web App" com.web.app --web-dir=www
          npx cap add android
          npx cap sync android
          cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
`;
  return `name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
`+steps+`      - name: Collect APK
        run: |
          APK=$(find . /tmp/cap -path "*outputs*" -name "*.apk" 2>/dev/null | head -1)
          echo "APK=$APK"
          test -n "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/app.apk"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v\${{ github.run_number }}
          name: Build \${{ github.run_number }}
          files: app.apk
`;
}

async function upload(){
  $('e4').textContent='';$('log').textContent='';
  zipFile=$('zip').files[0];
  if(!zipFile){$('e4').textContent='اختر ملف ZIP أولاً';return}
  $('upBtn').disabled=true;$('bar').classList.remove('hid');prog(0);
  try{
    log('قراءة الملف...');
    const z=await JSZip.loadAsync(zipFile);
    let names=Object.keys(z.files).filter(n=>!z.files[n].dir&&!/(^|\/)(__MACOSX|\.DS_Store)(\/|$)/.test(n)&&!n.startsWith('.git/'));
    if(!names.length)throw new Error('الملف فارغ');
    // إزالة المجلد الجذري الوحيد
    const roots=new Set(names.map(n=>n.split('/')[0]));
    const strip=(roots.size===1&&names.every(n=>n.includes('/')))?[...roots][0]+'/':'';
    log(`${names.length} ملف`);

    let repo=target;
    if(target.newRepo){
      log('إنشاء المشروع...');
      repo=await gh('/user/repos',{method:'POST',body:JSON.stringify({name:target.name,private:$('priv').checked,auto_init:true})});
    }
    const full=repo.full_name,branch=repo.default_branch||'main';

    let ref;
    try{ref=await gh(`/repos/${full}/git/ref/heads/${branch}`)}
    catch(e){
      log('مشروع فارغ، تهيئة...');
      await gh(`/repos/${full}/contents/.gitkeep`,{method:'PUT',body:JSON.stringify({message:'init',content:''})});
      ref=await gh(`/repos/${full}/git/ref/heads/${branch}`);
    }
    const base=ref.object.sha;

    // رفع الملفات (5 بالتوازي)
    log('رفع الملفات...');
    const tree=[];let done=0,i=0;
    async function worker(){
      while(i<names.length){
        const n=names[i++];
        const b64=await z.files[n].async('base64');
        let blob,tries=0;
        while(true){
          try{blob=await gh(`/repos/${full}/git/blobs`,{method:'POST',body:JSON.stringify({content:b64,encoding:'base64'})});break}
          catch(e){if(++tries>3)throw new Error(`فشل رفع ${n}: ${e.message}`);await new Promise(r=>setTimeout(r,1000*tries))}
        }
        tree.push({path:strip?n.slice(strip.length):n,mode:'100644',type:'blob',sha:blob.sha});
        prog(Math.round(++done/names.length*85));
      }
    }
    await Promise.all(Array.from({length:5},worker));

    if($('autoapk').checked){
      const paths=names.map(n=>strip?n.slice(strip.length):n);
      if(paths.some(x=>x.startsWith('.github/workflows/')))log('يوجد ملف بناء في المشروع، تُرك كما هو');
      else{
        const d=detect(paths);
        if(d){
          const yml=workflow(d);
          const bl=await gh(`/repos/${full}/git/blobs`,{method:'POST',body:JSON.stringify({content:btoa(unescape(encodeURIComponent(yml))),encoding:'base64'})});
          tree.push({path:'.github/workflows/build-apk.yml',mode:'100644',type:'blob',sha:bl.sha});
          log(`نوع المشروع: ${d.label} — أُضيف ملف بناء APK`);
        }else log('لم أتعرف على نوع المشروع، لم يُضف بناء APK');
      }
    }

    log('بناء الإصدار...');
    const body={tree};
    if(!$('replace').checked&&!target.newRepo)body.base_tree=base;
    else if(target.newRepo)body.base_tree=base,0;
    const t=await gh(`/repos/${full}/git/trees`,{method:'POST',body:JSON.stringify(body)});
    const msg=$('msg').value.trim()||(target.newRepo?'Initial upload':'Update')+' via Uploader';
    const c=await gh(`/repos/${full}/git/commits`,{method:'POST',body:JSON.stringify({message:msg,tree:t.sha,parents:[base]})});
    await gh(`/repos/${full}/git/refs/heads/${branch}`,{method:'PATCH',body:JSON.stringify({sha:c.sha})});
    prog(92);

    let pagesOn=false;
    if($('pages').checked){
      log('تفعيل GitHub Pages...');
      try{await gh(`/repos/${full}/pages`,{method:'POST',body:JSON.stringify({source:{branch,path:'/'}})});pagesOn=true}
      catch(e){pagesOn=(e.status===409||e.status===422)}
    }
    prog(100);
    showDone(full,branch,pagesOn,repo.private);
  }catch(e){
    $('e4').textContent=''+e.message;
  }finally{$('upBtn').disabled=false}
}

function showDone(full,branch,pagesOn,priv){
  const [o,n]=full.split('/');
  const items=[];
  items.push(['phone','تحميل APK مباشر','يعمل بعد انتهاء البناء (نحو 5 دقائق)',`https://github.com/${full}/releases/latest/download/app.apk`,1]);
  items.push(['download','تحميل المشروع (ZIP)','',`https://github.com/${full}/archive/refs/heads/${branch}.zip`]);
  if(pagesOn)items.push(['globe','رابط التطبيق على الويب','',`https://${o.toLowerCase()}.github.io/${n}/`]);
  items.push(['activity','متابعة البناء','Actions',`https://github.com/${full}/actions`]);
  items.push(['repo','صفحة المشروع','',`https://github.com/${full}`]);
  $('links').innerHTML=items.map(([i,t,sb,u,m],k)=>`<div class="lk${m?' main':''}"><div class="tile">${ic(i)}</div><div class="tx"><b>${t}</b>${sb?`<small>${sb}</small>`:''}<a class="u" target="_blank" rel="noopener" href="${u}">${u}</a></div><div class="act"><button class="ib" data-u="${u}" aria-label="نسخ">${ic('copy')}</button><a class="ib" target="_blank" rel="noopener" href="${u}" aria-label="فتح">${ic('ext')}</a></div></div>`).join('');
  $('links').querySelectorAll('button[data-u]').forEach(b=>b.onclick=()=>{
    try{navigator.clipboard.writeText(b.dataset.u)}catch{}
    b.innerHTML=ic('check');setTimeout(()=>b.innerHTML=ic('copy'),1500)});
  $('note').textContent=priv?'المشروع خاص: الروابط تعمل لحسابك فقط':full;
  go(5);
}
$('zip').onchange=()=>{const f=$('zip').files[0];$('zname').textContent=f?f.name:'اضغط لاختيار ملف ZIP';$('drop').classList.toggle('has',!!f)};
go(1);
// دخول تلقائي
const saved=store.get('gh_token');if(saved)login(saved);
</script>
