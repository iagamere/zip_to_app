<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>رافع GitHub</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mu:#6b7280;--pr:#2563eb;--bd:#e3e6ea;--ok:#16a34a;--er:#dc2626}
@media(prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#181b21;--tx:#e8eaed;--mu:#9aa0a8;--bd:#2a2f37}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;line-height:1.6}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:1.3rem;margin:8px 0 16px;display:flex;justify-content:space-between;align-items:center}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:12px}
input,select{width:100%;padding:12px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:1rem;margin:6px 0 10px}
button{width:100%;padding:13px;border:0;border-radius:10px;background:var(--pr);color:#fff;font-size:1rem;font-weight:600;margin-top:6px}
button.sec{background:transparent;color:var(--pr);border:1px solid var(--pr)}
button.mini{width:auto;padding:6px 12px;font-size:.85rem;margin:0}
button:disabled{opacity:.5}
.mu{color:var(--mu);font-size:.88rem}
.row{display:flex;gap:10px}
.row button{flex:1}
.hid{display:none}
label.chk{display:flex;gap:8px;align-items:center;margin:6px 0}
label.chk input{width:auto;margin:0}
#log{font-size:.85rem;color:var(--mu);white-space:pre-wrap;max-height:140px;overflow:auto}
.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden;margin:10px 0}
.bar i{display:block;height:100%;width:0;background:var(--pr);transition:width .2s}
.link{display:block;word-break:break-all;direction:ltr;text-align:left;padding:10px;background:var(--bg);border-radius:10px;margin:6px 0;font-size:.85rem;color:var(--pr)}
.err{color:var(--er);font-size:.9rem}
</style>
</head>
<body>
<main>
<h1><span>📦 رافع GitHub</span><button class="mini sec hid" id="out" onclick="logout()">خروج</button></h1>

<!-- 1: login -->
<section class="card" id="s1">
  <b>تسجيل الدخول</b>
  <p class="mu">أنشئ توكن من GitHub ← Settings ← Developer settings ← Personal access tokens (classic) وفعّل الصلاحيتين <b>repo</b> و <b>workflow</b>. يُحفظ في جهازك فقط.</p>
  <input id="tok" type="password" placeholder="ghp_xxxxxxxx" dir="ltr" autocomplete="off">
  <button onclick="login()">دخول</button>
  <p class="err" id="e1"></p>
</section>

<!-- 2: mode -->
<section class="card hid" id="s2">
  <b id="hello"></b>
  <p class="mu">ماذا تريد أن تفعل؟</p>
  <div class="row">
    <button onclick="pickMode('update')">🔄 تحديث مشروع</button>
    <button onclick="pickMode('new')">✨ مشروع جديد</button>
  </div>
</section>

<!-- 3: repo -->
<section class="card hid" id="s3">
  <div id="updBox">
    <b>اختر المشروع</b>
    <input id="q" placeholder="بحث..." oninput="fillRepos()">
    <select id="repoSel" size="7"></select>
  </div>
  <div id="newBox" class="hid">
    <b>مشروع جديد</b>
    <input id="newName" placeholder="اسم المشروع (بالإنجليزية)" dir="ltr">
    <label class="chk"><input type="checkbox" id="priv"> خاص (Private)</label>
  </div>
  <div class="row"><button class="sec" onclick="go(2)">رجوع</button><button onclick="step3()">التالي</button></div>
  <p class="err" id="e3"></p>
</section>

<!-- 4: zip -->
<section class="card hid" id="s4">
  <b>اختر ملف ZIP</b>
  <input type="file" id="zip" accept=".zip,application/zip">
  <label class="chk"><input type="checkbox" id="replace"> حذف الملفات القديمة واستبدالها بالكامل</label>
  <label class="chk"><input type="checkbox" id="pages" checked> تفعيل رابط التطبيق (GitHub Pages)</label>
  <label class="chk"><input type="checkbox" id="autoapk" checked> بناء APK تلقائياً (يضيف ملف البناء حسب نوع المشروع)</label>
  <input id="msg" placeholder="رسالة التحديث (اختياري)">
  <div class="row"><button class="sec" onclick="go(3)">رجوع</button><button id="upBtn" onclick="upload()">رفع</button></div>
  <div class="bar hid" id="bar"><i id="bi"></i></div>
  <div id="log"></div>
  <p class="err" id="e4"></p>
</section>

<!-- 5: done -->
<section class="card hid" id="s5">
  <b style="color:var(--ok)">✅ تم الرفع بنجاح</b>
  <div id="links"></div>
  <p class="mu" id="note"></p>
  <button onclick="go(2)">رفع مشروع آخر</button>
</section>
</main>

<script>
const $=s=>document.getElementById(s);
let token='',user=null,repos=[],mode='',zipFile=null;
const store={get:k=>{try{return localStorage.getItem(k)}catch{return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch{}},del:k=>{try{localStorage.removeItem(k)}catch{}}};

function go(n){for(let i=1;i<=5;i++)$('s'+i).classList.toggle('hid',i!==n);$('out').classList.toggle('hid',!user)}
async function gh(path,opt={}){
  const r=await fetch('https://api.github.com'+path,{...opt,headers:{Authorization:'Bearer '+token,Accept:'application/vnd.github+json','Content-Type':'application/json'}});
  if(!r.ok){let m='';try{m=(await r.json()).message}catch{}const e=new Error(m||('HTTP '+r.status));e.status=r.status;throw e}
  return r.status===204?null:r.json();
}
async function login(t){
  token=(typeof t==='string'?t:$('tok').value).trim();$('e1').textContent='⏳ جاري التحقق...';
  if(!token){$('e1').textContent='أدخل التوكن';return}
  try{
    user=await gh('/user');$('e1').textContent='';store.set('gh_token',token);
    $('hello').textContent='👋 أهلاً '+user.login;go(2);
  }catch(e){user=null;token='';store.del('gh_token');go(1);$('e1').textContent='فشل الدخول: '+e.message}
}
function logout(){store.del('gh_token');user=null;token='';repos=[];$('tok').value='';go(1)}
async function loadRepos(){
  repos=[];
  for(let p=1;p<=5;p++){
    const r=await gh(`/user/repos?per_page=100&page=${p}&sort=updated&affiliation=owner`);
    repos.push(...r);if(r.length<100)break;
  }
}
function fillRepos(){
  const q=$('q').value.toLowerCase(),s=$('repoSel');s.innerHTML='';
  repos.filter(r=>r.name.toLowerCase().includes(q)).forEach(r=>{
    const o=document.createElement('option');o.value=r.full_name;o.textContent=(r.private?'🔒 ':'')+r.name;s.appendChild(o);
  });
}
async function pickMode(m){
  mode=m;$('e3').textContent='';
  $('updBox').classList.toggle('hid',m!=='update');$('newBox').classList.toggle('hid',m!=='new');
  go(3);
  if(m==='update'&&!repos.length){
    $('repoSel').innerHTML='<option>جاري التحميل...</option>';
    try{await loadRepos()}catch(e){$('e3').textContent=e.message}
    fillRepos();
  }
}
let target=null;
function step3(){
  $('e3').textContent='';
  if(mode==='update'){
    const v=$('repoSel').value;if(!v||v.includes('جاري')){$('e3').textContent='اختر مشروعاً';return}
    target=repos.find(r=>r.full_name===v);
  }else{
    const n=$('newName').value.trim();
    if(!/^[A-Za-z0-9._-]+$/.test(n)){$('e3').textContent='اسم غير صالح: أحرف إنجليزية وأرقام و - _ . فقط';return}
    target={name:n,newRepo:true};
  }
  go(4);
}
const log=t=>{$('log').textContent+=t+'\n';$('log').scrollTop=1e9};
const prog=p=>{$('bi').style.width=p+'%'};

const dirOf=p=>p.includes('/')?p.slice(0,p.lastIndexOf('/')):'.';
const shortest=a=>a.sort((x,y)=>x.split('/').length-y.split('/').length)[0];
function detect(paths){
  const f=re=>shortest(paths.filter(p=>re.test(p)));let p;
  if(p=f(/(^|\/)pubspec\.yaml$/))return{t:'flutter',dir:dirOf(p),label:'Flutter'};
  if(p=f(/(^|\/)capacitor\.config\.(json|ts|js)$/))return{t:'cap',dir:dirOf(p),label:'Capacitor'};
  if(p=f(/(^|\/)settings\.gradle(\.kts)?$/))return{t:'android',dir:dirOf(p),label:'Android (Gradle)'};
  if(p=f(/(^|\/)index\.html$/))return{t:'web',dir:dirOf(p),label:'ويب (HTML)'};
  return null;
}
function workflow(d){
  const D=d.dir;
  const J17=`      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
`;
  const NODE=`      - uses: actions/setup-node@v4
        with:
          node-version: 20
`;
  let steps='';
  if(d.t==='android')steps=J17+`      - name: Accept licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build
        run: |
          cd "${D}"
          if [ -f gradlew ]; then chmod +x gradlew; ./gradlew assembleDebug --no-daemon --stacktrace; else gradle assembleDebug --no-daemon --stacktrace; fi
`;
  else if(d.t==='flutter')steps=J17+`      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build
        run: |
          cd "${D}"
          [ -d android ] || flutter create --platforms=android .
          flutter pub get
          flutter build apk --release
`;
  else if(d.t==='cap')steps=NODE+J17+`      - name: Build
        run: |
          cd "${D}"
          npm install
          npm run build --if-present
          [ -d android ] || npx cap add android
          npx cap sync android
          cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
`;
  else steps=NODE+J17+`      - name: Wrap web app
        run: |
          mkdir -p /tmp/cap/www
          cp -r "${D}"/. /tmp/cap/www/
          cd /tmp/cap
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "Web App" com.web.app --web-dir=www
          npx cap add android
          npx cap sync android
          cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
`;
  return `name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
`+steps+`      - name: Collect APK
        run: |
          APK=$(find . /tmp/cap -path "*outputs*" -name "*.apk" 2>/dev/null | head -1)
          echo "APK=$APK"
          test -n "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/app.apk"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v\${{ github.run_number }}
          name: Build \${{ github.run_number }}
          files: app.apk
`;
}

async function upload(){
  $('e4').textContent='';$('log').textContent='';
  zipFile=$('zip').files[0];
  if(!zipFile){$('e4').textContent='اختر ملف ZIP أولاً';return}
  $('upBtn').disabled=true;$('bar').classList.remove('hid');prog(0);
  try{
    log('📖 قراءة الملف...');
    const z=await JSZip.loadAsync(zipFile);
    let names=Object.keys(z.files).filter(n=>!z.files[n].dir&&!/(^|\/)(__MACOSX|\.DS_Store)(\/|$)/.test(n)&&!n.startsWith('.git/'));
    if(!names.length)throw new Error('الملف فارغ');
    // إزالة المجلد الجذري الوحيد
    const roots=new Set(names.map(n=>n.split('/')[0]));
    const strip=(roots.size===1&&names.every(n=>n.includes('/')))?[...roots][0]+'/':'';
    log(`📁 ${names.length} ملف`);

    let repo=target;
    if(target.newRepo){
      log('🆕 إنشاء المشروع...');
      repo=await gh('/user/repos',{method:'POST',body:JSON.stringify({name:target.name,private:$('priv').checked,auto_init:true})});
    }
    const full=repo.full_name,branch=repo.default_branch||'main';

    let ref;
    try{ref=await gh(`/repos/${full}/git/ref/heads/${branch}`)}
    catch(e){
      log('⚙️ مشروع فارغ، تهيئة...');
      await gh(`/repos/${full}/contents/.gitkeep`,{method:'PUT',body:JSON.stringify({message:'init',content:''})});
      ref=await gh(`/repos/${full}/git/ref/heads/${branch}`);
    }
    const base=ref.object.sha;

    // رفع الملفات (5 بالتوازي)
    log('⬆️ رفع الملفات...');
    const tree=[];let done=0,i=0;
    async function worker(){
      while(i<names.length){
        const n=names[i++];
        const b64=await z.files[n].async('base64');
        let blob,tries=0;
        while(true){
          try{blob=await gh(`/repos/${full}/git/blobs`,{method:'POST',body:JSON.stringify({content:b64,encoding:'base64'})});break}
          catch(e){if(++tries>3)throw new Error(`فشل رفع ${n}: ${e.message}`);await new Promise(r=>setTimeout(r,1000*tries))}
        }
        tree.push({path:strip?n.slice(strip.length):n,mode:'100644',type:'blob',sha:blob.sha});
        prog(Math.round(++done/names.length*85));
      }
    }
    await Promise.all(Array.from({length:5},worker));

    if($('autoapk').checked){
      const paths=names.map(n=>strip?n.slice(strip.length):n);
      if(paths.some(x=>x.startsWith('.github/workflows/')))log('ℹ️ يوجد ملف بناء في المشروع، تُرك كما هو');
      else{
        const d=detect(paths);
        if(d){
          const yml=workflow(d);
          const bl=await gh(`/repos/${full}/git/blobs`,{method:'POST',body:JSON.stringify({content:btoa(unescape(encodeURIComponent(yml))),encoding:'base64'})});
          tree.push({path:'.github/workflows/build-apk.yml',mode:'100644',type:'blob',sha:bl.sha});
          log(`🤖 نوع المشروع: ${d.label} — أُضيف ملف بناء APK`);
        }else log('ℹ️ لم أتعرف على نوع المشروع، لم يُضف بناء APK');
      }
    }

    log('🌳 بناء الإصدار...');
    const body={tree};
    if(!$('replace').checked&&!target.newRepo)body.base_tree=base;
    else if(target.newRepo)body.base_tree=base,0;
    const t=await gh(`/repos/${full}/git/trees`,{method:'POST',body:JSON.stringify(body)});
    const msg=$('msg').value.trim()||(target.newRepo?'Initial upload':'Update')+' via Uploader';
    const c=await gh(`/repos/${full}/git/commits`,{method:'POST',body:JSON.stringify({message:msg,tree:t.sha,parents:[base]})});
    await gh(`/repos/${full}/git/refs/heads/${branch}`,{method:'PATCH',body:JSON.stringify({sha:c.sha})});
    prog(92);

    let pagesOn=false;
    if($('pages').checked){
      log('🌐 تفعيل GitHub Pages...');
      try{await gh(`/repos/${full}/pages`,{method:'POST',body:JSON.stringify({source:{branch,path:'/'}})});pagesOn=true}
      catch(e){pagesOn=(e.status===409||e.status===422)}
    }
    prog(100);
    showDone(full,branch,pagesOn,repo.private);
  }catch(e){
    $('e4').textContent='❌ '+e.message;
  }finally{$('upBtn').disabled=false}
}

function showDone(full,branch,pagesOn,priv){
  const [o,n]=full.split('/');
  const items=[];
  items.push(['⬇️ تحميل مباشر (ZIP)',`https://github.com/${full}/archive/refs/heads/${branch}.zip`]);
  if(pagesOn)items.push(['🌐 رابط التطبيق',`https://${o.toLowerCase()}.github.io/${n}/`]);
  items.push(['📂 صفحة المشروع',`https://github.com/${full}`]);
  items.push(['📱 تحميل APK مباشر (بعد انتهاء البناء ~5 دقائق)',`https://github.com/${full}/releases/latest/download/app.apk`]);
  items.push(['⚙️ متابعة البناء (Actions)',`https://github.com/${full}/actions`]);
  $('links').innerHTML='';
  items.forEach(([t,u])=>{
    const d=document.createElement('div');
    d.innerHTML=`<div style="margin-top:10px"><b>${t}</b></div><a class="link" target="_blank" rel="noopener" href="${u}">${u}</a>`;
    const b=document.createElement('button');b.className='sec';b.textContent='نسخ الرابط';
    b.onclick=()=>{navigator.clipboard&&navigator.clipboard.writeText(u);b.textContent='تم النسخ ✓'};
    d.appendChild(b);$('links').appendChild(d);
  });
  $('note').textContent=(priv?'⚠️ المشروع خاص: الروابط تعمل لك فقط. ':'')+'رابط التطبيق قد يحتاج دقيقة أو دقيقتين ليبدأ العمل بعد أول تفعيل.';
  go(5);
}

window.onerror=(m)=>{$('e1').textContent='خطأ: '+m};
if(!/^https?:$/.test(location.protocol))$('e1').textContent='⚠️ الصفحة مفتوحة من ملف محلي ('+location.protocol+') وقد يمنع المتصفح الاتصال. استضفها على GitHub Pages ثم افتحها برابط https.';
// دخول تلقائي
const saved=store.get('gh_token');if(saved)login(saved);
</script>
</body>
</html>
